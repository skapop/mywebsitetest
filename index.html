<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Generalforsamling – Avstemning</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand"><div class="header-logo" id="headerLogo"></div><h1>Generalforsamling</h1></div>
  <span id="statusBadge" class="badge">Ikke startet</span>
</header>
<main>
  <section class="card" id="votingView">
    <h2 id="electionTitle">Ingen aktiv avstemning</h2>
    <p id="instruction">Vent på at admin starter neste avstemning.</p>
    <div id="voterCodeBox" class="voter-code" hidden>
      <label for="voterCode">Din stemmekode</label>
      <input id="voterCode" autocomplete="off" placeholder="Skriv inn koden du har fått">
      <small>Koden brukes for å hindre at samme kode stemmer flere ganger.</small>
    </div>
    <div id="voteArea"></div>
    <button id="submitVote" class="primary" hidden>Lever stemme</button>
  </section>
  <section class="card" id="resultView" hidden>
    <h2>Resultat</h2>
    <div id="resultContent"></div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/stv.js"></script>
<script src="js/app.js"></script>
</body>
</html>
