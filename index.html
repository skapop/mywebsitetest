<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test Projects</title>
  <style>
    :root {
      --bg: #fafaf7;
      --text: #1d1f23;
      --muted: #6a6f78;
      --line: #dcdcd4;
      --accent: #2456d6;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16181c;
        --text: #e8e9ec;
        --muted: #9096a0;
        --line: #2c3037;
        --accent: #7ba2ff;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }

    main {
      max-width: 40rem;
      margin: 0 auto;
      padding: 4rem 1.5rem;
    }

    h1 {
      font-size: 1.75rem;
      margin: 0 0 0.25rem;
    }

    .intro {
      color: var(--muted);
      margin: 0 0 2rem;
    }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
      border-top: 1px solid var(--line);
    }

    li { border-bottom: 1px solid var(--line); }

    a {
      display: block;
      padding: 1rem 0.5rem;
      color: inherit;
      text-decoration: none;
    }

    a:hover, a:focus-visible {
      background: color-mix(in srgb, var(--accent) 8%, transparent);
    }

    a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
    }

    .name {
      display: block;
      font-weight: 600;
      color: var(--accent);
    }

    .desc {
      display: block;
      font-size: 0.9rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <h1>Test Projects</h1>
    <p class="intro">Pick a project to open it.</p>

    <!-- To add a project, copy one <li> block and change the href, name and description. -->
    <ul>
      <li>
        <a href="/project-one/">
          <span class="name">Project One</span>
          <span class="desc">Short description of what this tests</span>
        </a>
      </li>
      <li>
        <a href="/project-two/">
          <span class="name">Project Two</span>
          <span class="desc">Short description of what this tests</span>
        </a>
      </li>
      <li>
        <a href="/project-three/">
          <span class="name">Project Three</span>
          <span class="desc">Short description of what this tests</span>
        </a>
      </li>
    </ul>
  </main>
</body>
</html>
