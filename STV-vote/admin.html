<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin – Generalforsamling</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div><h1>Admin – Generalforsamling</h1><small id="backendStatus">Lokal demo</small></div>
  <span id="adminStatus" class="badge">Klargjøring</span>
</header>
<main class="admin-grid">
  <section class="card logo-card">
    <h2>Logo</h2>
    <div class="logo-frame" id="logoFrame"><span>Ingen logo<br><small>Last opp senere</small></span></div>
    <input id="logoInput" type="file" accept="image/png,image/jpeg,image/svg+xml" hidden>
    <button class="secondary" id="logoButton">Last opp logo</button>
    <button class="secondary" id="removeLogo">Fjern logo</button>
    <p class="muted">Logoen brukes som visuell plassholder i prototypen.</p>
  </section>

  <section class="card">
    <h2>Posisjoner</h2>
    <div id="positionList"></div>
  </section>

  <section class="card">
    <h2 id="editorTitle">Velg en posisjon</h2>
    <div id="editor"><p>Velg en posisjon til venstre for å legge inn kandidater.</p></div>
  </section>

  <section class="card wide" id="resultsCard" hidden>
    <h2>Resultat</h2>
    <div id="adminResults"></div>
  </section>

  <section class="card wide">
    <h2>System</h2>
    <p id="systemMessage" class="muted">Kobler til backend …</p>
    <button id="clearData" class="danger">Nullstill lokal demo</button>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/stv.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
