<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generalforsamling - Admin</title>
  <style>
    :root { --primary: #0056b3; --bg: #f4f6f8; --card: #fff; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 20px; color: #333; }
    .container { max-width: 900px; margin: 0 auto; }
    .card { background: var(--card); padding: 24px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
    h1, h2, h3 { margin-top: 0; }
    .status-badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-weight: bold; text-transform: uppercase; font-size: 0.8rem; }
    .status-waiting { background: #e2e3e5; color: #383d41; }
    .status-active { background: #d4edda; color: #155724; }
    .status-finished { background: #cce5ff; color: #004085; }
    .btn { background: var(--primary); color: white; border: none; padding: 10px 16px; border-radius: 4px; cursor: pointer; font-size: 1rem; margin-right: 8px; margin-bottom: 8px; }
    .btn:hover { opacity: 0.9; }
    .btn-danger { background: #dc3545; }
    .btn-success { background: #28a745; }
    .btn-warning { background: #ffc107; color: #212529; }
    .input-group { margin-bottom: 12px; display: flex; gap: 8px; }
    input[type="text"] { padding: 8px; border: 1px solid #ccc; border-radius: 4px; flex: 1; }
    ul { list-style: none; padding: 0; }
    li { padding: 8px 12px; background: #f8f9fa; border: 1px solid #ddd; margin-bottom: 6px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
    .winner-box { background: #d4edda; border: 1px solid #c3e6cb; color: #155724; padding: 16px; border-radius: 6px; font-size: 1.2rem; font-weight: bold; margin-top: 15px; }
    .toggle-container { display: flex; align-items: center; gap: 10px; margin: 15px 0; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Admin - Generalforsamling Valg</h1>

    <!-- Valgvelger -->
    <div class="card">
      <h2>1. Velg posisjon / valgomgang</h2>
      <select id="electionSelect" style="width: 100%; padding: 10px; font-size: 1rem;"></select>
    </div>

    <!-- Gjeldende Valg Status -->
    <div class="card" id="electionDetailCard" style="display:none;">
      <h2 id="posTitle"></h2>
      <p><strong>Status:</strong> <span id="posStatus" class="status-badge"></span></p>
      <p><strong>Seter som skal fylles:</strong> <span id="posSeats"></span></p>

      <!-- Kvoteringsinnstilling -->
      <div class="toggle-container">
        <input type="checkbox" id="repToggle" style="width: 20px; height: 20px;">
        <label for="repToggle"><strong>Aktiver styrekvotering/reservasjon for dette valget</strong> (Sikrer at minst 2 plasser dekkes av spesifisert gruppe hvis de ikke allerede er valgt).</label>
      </div>
      <div id="repDetails" style="display:none; margin-bottom: 15px; background: #eef2f5; padding: 10px; border-radius: 4px;">
        <p style="margin: 0;">Målgruppe: <strong>Undergruppe</strong> (Sikrer 2 representanter)</p>
      </div>

      <hr>

      <!-- Kandidatstyring -->
      <h3>Kandidater for denne posisjonen</h3>
      <div class="input-group">
        <input type="text" id="candName" placeholder="Kandidatens navn">
        <input type="text" id="candGroup" placeholder="Gruppe (valgfritt, f.eks. 'Undergruppe')">
        <button class="btn" id="addCandBtn">Legg til</button>
      </div>

      <ul id="candidateList"></ul>

      <hr>

      <!-- Styring av Avstemning -->
      <h3>Styr Avstemning</h3>
      <div>
        <button class="btn btn-success" id="startBtn">Start Avstemning</button>
        <button class="btn btn-warning" id="stopBtn">Stopp Avstemning</button>
        <button class="btn" id="calcBtn">Beregn & Vis Resultat</button>
        <button class="btn btn-danger" id="resetBtn">Nullstill Valg/Stemmer</button>
      </div>

      <p style="margin-top: 10px;">Mottatte stemmer: <strong id="voteCount">0</strong></p>

      <!-- Resultatvisning -->
      <div id="winnerContainer" style="display:none;">
        <div class="winner-box" id="winnerBox"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    import { calculateSTV } from './stv.js';

    // SUPABASE CONFIGURATION - ERSTATT MED DINE NØKLER
    const SUPABASE_URL = 'https://qtsfzbqkgjifcfceihre.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_4IZSLlq7DM_vyw_V0tUj9w_TlZ7Zswu';
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let elections = [];
    let currentElection = null;
    let candidates = [];

    // DOM Elementer
    const electionSelect = document.getElementById('electionSelect');
    const electionDetailCard = document.getElementById('electionDetailCard');
    const posTitle = document.getElementById('posTitle');
    const posStatus = document.getElementById('posStatus');
    const posSeats = document.getElementById('posSeats');
    const repToggle = document.getElementById('repToggle');
    const repDetails = document.getElementById('repDetails');
    const candName = document.getElementById('candName');
    const candGroup = document.getElementById('candGroup');
    const addCandBtn = document.getElementById('addCandBtn');
    const candidateList = document.getElementById('candidateList');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const calcBtn = document.getElementById('calcBtn');
    const resetBtn = document.getElementById('resetBtn');
    const voteCount = document.getElementById('voteCount');
    const winnerContainer = document.getElementById('winnerContainer');
    const winnerBox = document.getElementById('winnerBox');

    async function init() {
      await loadElections();
      subscribeRealtime();
    }

    async function loadElections() {
      const { data, error } = await supabase.from('elections').select('*').order('position_number', { ascending: true });
      if (error) return console.error(error);
      elections = data;

      electionSelect.innerHTML = '<option value="">-- Velg valg/posisjon --</option>';
      elections.forEach(e => {
        const opt = document.createElement('option');
        opt.value = e.id;
        opt.textContent = `${e.position_number}. ${e.position_name} (${e.status})`;
        electionSelect.appendChild(opt);
      });

      if (currentElection) {
        electionSelect.value = currentElection.id;
        await selectElection(currentElection.id);
      }
    }

    electionSelect.addEventListener('change', (e) => {
      if (e.target.value) selectElection(e.target.value);
      else electionDetailCard.style.display = 'none';
    });

    async function selectElection(id) {
      currentElection = elections.find(e => e.id === id);
      if (!currentElection) return;

      posTitle.textContent = `${currentElection.position_number}. ${currentElection.position_name}`;
      posSeats.textContent = currentElection.seats;
      posStatus.textContent = currentElection.status;
      posStatus.className = `status-badge status-${currentElection.status}`;

      repToggle.checked = currentElection.representation_enabled;
      repDetails.style.display = repToggle.checked ? 'block' : 'none';

      electionDetailCard.style.display = 'block';

      await loadCandidates();
      await updateVoteCount();
      await loadWinners();
    }

    async function loadCandidates() {
      const { data } = await supabase.from('candidates').select('*').eq('election_id', currentElection.id);
      candidates = data || [];
      candidateList.innerHTML = '';
      candidates.forEach(c => {
        const li = document.createElement('li');
        li.innerHTML = `<span><strong>${c.name}</strong> ${c.group_name ? `(${c.group_name})` : ''}</span>
                        <button class="btn btn-danger" style="padding: 2px 8px; margin:0;" onclick="deleteCandidate('${c.id}')">Slett</button>`;
        candidateList.appendChild(li);
      });
    }

    window.deleteCandidate = async (id) => {
      await supabase.from('candidates').delete().eq('id', id);
      await loadCandidates();
    };

    addCandBtn.addEventListener('click', async () => {
      const name = candName.value.trim();
      const group = candGroup.value.trim();
      if (!name || !currentElection) return;

      await supabase.from('candidates').insert([{
        election_id: currentElection.id,
        name: name,
        group_name: group || null
      }]);

      candName.value = '';
      candGroup.value = '';
      await loadCandidates();
    });

    repToggle.addEventListener('change', async (e) => {
      const enabled = e.target.checked;
      repDetails.style.display = enabled ? 'block' : 'none';
      await supabase.from('elections').update({
        representation_enabled: enabled,
        representation_group: enabled ? 'Undergruppe' : null
      }).eq('id', currentElection.id);
      currentElection.representation_enabled = enabled;
    });

    startBtn.addEventListener('click', async () => {
      await supabase.from('elections').update({ status: 'active', result_visible: false }).eq('id', currentElection.id);
      winnerContainer.style.display = 'none';
      await loadElections();
    });

    stopBtn.addEventListener('click', async () => {
      await supabase.from('elections').update({ status: 'finished' }).eq('id', currentElection.id);
      await loadElections();
    });

    async function updateVoteCount() {
      if (!currentElection) return;
      const { count } = await supabase.from('votes').select('*', { count: 'exact', head: true }).eq('election_id', currentElection.id);
      voteCount.textContent = count || 0;
    }

    // Beregn vinner ved hjelp av STV og kvoteringssjekk på tvers av tidligere posisjoner
    calcBtn.addEventListener('click', async () => {
      if (!currentElection) return;

      // 1. Hent alle stemmer for dette valget
      const { data: votes } = await supabase.from('votes').select('ranking').eq('election_id', currentElection.id);

      // 2. Sjekk hvor mange fra kvotegruppen som allerede har vunnet i tidligere poser
      const targetGroup = 'Undergruppe';
      let alreadyFilled = 0;

      const { data: allWinners } = await supabase.from('winners').select('candidate_id, candidates(group_name)');
      if (allWinners) {
        alreadyFilled = allWinners.filter(w => w.candidates?.group_name?.trim().toLowerCase() === targetGroup.toLowerCase()).length;
      }

      // 3. Kjør STV
      const winningCandidates = calculateSTV(
        candidates,
        votes || [],
        currentElection.seats,
        currentElection.representation_enabled,
        targetGroup,
        currentElection.representation_required,
        alreadyFilled
      );

      // 4. Lagre vinnere i databasen
      await supabase.from('winners').delete().eq('election_id', currentElection.id);
      if (winningCandidates.length > 0) {
        const winnerInserts = winningCandidates.map(w => ({
          election_id: currentElection.id,
          candidate_id: w.id
        }));
        await supabase.from('winners').insert(winnerInserts);
      }

      // 5. Gjør resultat synlig for alle
      await supabase.from('elections').update({ result_visible: true, status: 'finished' }).eq('id', currentElection.id);

      await loadWinners();
      await loadElections();
    });

    async function loadWinners() {
      const { data: winners } = await supabase.from('winners')
        .select('candidate_id, candidates(name)')
        .eq('election_id', currentElection.id);

      if (winners && winners.length > 0 && currentElection.result_visible) {
        const names = winners.map(w => w.candidates.name).join(', ');
        winnerBox.innerHTML = `🏆 Vinner(e): <strong>${names}</strong>`;
        winnerContainer.style.display = 'block';
      } else {
        winnerContainer.style.display = 'none';
      }
    }

    resetBtn.addEventListener('click', async () => {
      if (!confirm('Er du sikker på at du vil nullstille stemmer og vinnere for dette valget?')) return;
      await supabase.from('votes').delete().eq('election_id', currentElection.id);
      await supabase.from('winners').delete().eq('election_id', currentElection.id);
      await supabase.from('elections').update({ status: 'waiting', result_visible: false }).eq('id', currentElection.id);
      await loadElections();
    });

    function subscribeRealtime() {
      supabase.channel('admin-changes')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'votes' }, () => updateVoteCount())
        .subscribe();
    }

    init();
  </script>
</body>
</html>
